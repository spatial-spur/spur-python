name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      spatial_rust_ref:
        description: Shared Rust commit or branch for the native test job
        required: false
        type: string
      scpc_python_ref:
        description: Matching SCPC commit or branch for the native test job
        required: false
        type: string
  workflow_call:

jobs:
    test:
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]

      runs-on: ${{ matrix.os }}

      steps:
        - name: checkout code
          uses: actions/checkout@v6

        - name: Install uv and Python
          uses: astral-sh/setup-uv@v8.0.0
          with:
            python-version: "3.11"
            enable-cache: true

        - name: Install dependencies
          run: uv sync --locked --group dev

        - name: Run tests
          run: uv run -m pytest

    native:
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.spatial_rust_ref != '' && inputs.scpc_python_ref != '' }}
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macos-latest, windows-latest]
      runs-on: ${{ matrix.os }}
      steps:
        - uses: actions/checkout@v6
        - uses: actions/checkout@v6
          with:
            repository: spatial-spur/spatial-rust
            ref: ${{ inputs.spatial_rust_ref }}
            path: native-core
            persist-credentials: false
        - uses: actions/checkout@v6
          with:
            repository: spatial-spur/scpc-python
            ref: ${{ inputs.scpc_python_ref }}
            path: native-scpc
            persist-credentials: false
        - uses: astral-sh/setup-uv@v8.0.0
          with:
            python-version: '3.11'
        - name: Install dependencies and build the native extension
          run: |
            rustup toolchain install stable --profile minimal
            uv sync --locked --group dev
            uv pip install ./native-core/crates/spatial-py ./native-scpc
        - name: Require both compatible native adapters
          run: uv run --no-sync python -c 'from scpc.core import load_rust_backend as scpc; from spur.core import load_rust_backend as spur; assert scpc() is not None and spur() is not None'
        - name: Test native execution and fallback parity
          run: uv run --no-sync -m pytest tests/test_rust_spur.py tests/test_public_corrections.py tests/test_spur.py tests/test_spurtransform.py tests/test_spurhalflife.py tests/test_spur_utils.py

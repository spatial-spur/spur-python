name: Tests

on:
  push:
    branches: [main, rust-core]
  pull_request:
    branches: [main, rust-core]
  workflow_dispatch:
    inputs:
      spatial_rust_ref:
        description: Matching spatial-rust branch, tag, or commit
        type: string
      scpc_python_ref:
        description: Matching scpc-python branch, tag, or commit
        type: string
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [fallback, rust]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: package
    steps:
      - uses: actions/checkout@v6
        with:
          path: package
          persist-credentials: false
      - uses: actions/checkout@v6
        if: matrix.backend == 'rust'
        with:
          repository: spatial-spur/spatial-rust
          ref: ${{ inputs.spatial_rust_ref || vars.SPATIAL_RUST_REF || 'rust-core' }}
          path: spatial-rust
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: spatial-spur/scpc-python
          ref: ${{ inputs.scpc_python_ref || vars.SCPC_PYTHON_REF || 'rust-core' }}
          path: scpc-python
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: package/uv.lock
      - name: Install locked dependencies and build frontend wheels
        run: |
          uv sync --locked --group dev --no-install-project
          uv build --wheel --out-dir ../wheels
          uv build ../scpc-python --wheel --out-dir ../wheels
      - name: Build the native wheel
        if: matrix.backend == 'rust'
        env:
          MATURIN_PEP517_ARGS: --locked
        run: uv build ../spatial-rust/crates/spatial-py --wheel --out-dir ../wheels
      - name: Install and check the built wheels
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          uv pip install --reinstall --no-deps ../wheels/*.whl
          uv run --no-sync python - <<'PYTHON'
          import os
          import sysconfig
          from pathlib import Path
          from importlib import import_module

          for name in ("scpc", "spur"):
              package = import_module(name)
              assert Path(package.__file__).is_relative_to(Path(sysconfig.get_path("purelib")))
              core = import_module(name + ".core")
              assert (core.load_rust_backend() is not None) == (os.environ["BACKEND"] == "rust")
          PYTHON
      - name: Run the installed package tests
        run: uv run --no-sync python -m pytest
      - name: Exercise real Patsy and Formulaic fits on statsmodels 0.15
        run: |
          uv pip install 'statsmodels==0.15.0' formulaic
          for engine in patsy formulaic; do
            SM_FORMULA_ENGINE="$engine" uv run --no-sync python -m pytest -q tests/test_spur.py tests/test_rust_spur.py
          done
